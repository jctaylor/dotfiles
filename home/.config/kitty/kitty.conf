# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

# font config
font_family Hacker Nerd Font
font_size 14

remember_window_size no

initial_window_width 140c
initial_window_height 60c

# Scrolling
scrollbar always
scrollbar_interactive yes
scrollbar_jump_on_click yes


